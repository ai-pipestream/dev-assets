name = "connector-intake-service"

[[repo]]
path = "main/core-services"
name = "repository-service"

[[repo]]
path = "main/core-services"
name = "pipestream-engine"

[[repo]]
path = "main/core-services"
name = "pipestream-opensearch"

# pipestream-opensearch-client was deleted from Forgejo (folded into
# pipestream-opensearch). Entry removed 2026-07-10; the on-disk checkout
