# Standalone CPU docling + DJL serving — for the parse + embeddings smoke test.
# No GPU required. DJL uses the cpu-full image (PyTorch bundled, needed for the
# HuggingFace sentence-transformer models). Slower than the GPU variant.
#
#   ../run-test.sh cpu
name: docling-djl-cpu

services:
  docling-serve:
    container_name: ddl-docling-cpu
    image: ghcr.io/docling-project/docling-serve:v1.32.0
    ports: ["5001:5001"]
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "2"
      DOCLING_SERVE_ENG_LOC_SHARE_MODELS: "true"
      DOCLING_SERVE_MAX_SYNC_WAIT: "600"
      OMP_NUM_THREADS: "8"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  djl-serving:
    container_name: ddl-djl-cpu
    image: deepjavalibrary/djl-serving:0.36.0-cpu-full
    ports: ["8090:8080"]
    environment:
      MODEL_LOADING_TIMEOUT: "1200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
